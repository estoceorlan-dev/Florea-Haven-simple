<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fffaf8" />
    <meta
      name="description"
      content="Floréa Haven — flowers, seeds, and botanical fragrances."
    />
    <title>Return to your Haven. — Floréa Haven</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/theme-init.js"></script>
    <script type="module" src="/js/common.js"></script>
    <script type="module" src="/js/auth.js"></script>
  </head>
  <body data-page="login" data-access="public">
    <!-- The complete page layout is here. JavaScript only fills data and handles actions. -->
    <main
      class="grid min-h-screen bg-canvas lg:grid-cols-[1.05fr_0.95fr]"
      id="main-content"
      tabindex="-1"
    >
      <section
        class="flex min-h-screen flex-col px-5 py-6 sm:px-10 lg:px-16 xl:px-24"
        role="main"
      >
        <p id="page-error" class="form-alert mb-6" role="alert" hidden=""></p>
        <p
          id="page-notice"
          class="mb-6 rounded-control border border-border bg-surface-muted p-4 text-sm text-text"
          role="status"
          hidden=""
        ></p>
        <div class="flex items-center justify-between">
          <a aria-label="Floréa Haven home" href="/">
            <span class="inline-flex items-center gap-1.5 text-evergreen sm:gap-2.5">
              <span
                aria-hidden="true"
                class="hidden min-[400px]:grid size-8 shrink-0 place-items-center rounded-full border border-evergreen/20 bg-sage/50 sm:size-9"
              >
                <span class="brand-sprout">F</span>
              </span>
              <span
                class="whitespace-nowrap font-display text-[1.15rem] leading-none tracking-[-0.035em] sm:text-[1.65rem]"
              >
                Floréa
                <i class="font-normal text-clay">Haven</i>
              </span>
            </span>
          </a>
          <a class="text-link" href="/">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-arrow-left"
              aria-hidden="true"
            >
              <path d="m12 19-7-7 7-7"></path>
              <path d="M19 12H5"></path>
            </svg>
            Home
          </a>
        </div>
        <div class="mx-auto flex w-full max-w-lg flex-1 items-center py-14">
          <div
            class="w-full rounded-card border border-border bg-surface p-6 shadow-low sm:p-8"
          >
            <p class="eyebrow text-clay">Welcome back</p>
            <h1
              class="mt-3 font-display text-5xl leading-[0.98] tracking-[-0.055em] text-evergreen sm:text-6xl"
            >
              Return to your Haven.
            </h1>
            <p class="mt-5 max-w-sm text-sm leading-7 text-text-muted">
              Sign in to continue to your saved cart, orders, and garden-inspired finds.
            </p>
            <div class="mt-9">
              <form class="space-y-5" method="post" id="auth-form">
                <div class="form-field">
                  <label for="login-email">Email address</label>
                  <input
                    id="login-email"
                    class="form-input"
                    type="email"
                    autocomplete="email"
                    required=""
                    name="email"
                  />
                </div>
                <div class="form-field">
                  <label for="login-password">Password</label>
                  <input
                    id="login-password"
                    class="form-input"
                    type="password"
                    autocomplete="current-password"
                    required=""
                    name="password"
                  />
                </div>
                <button class="button-primary w-full" type="submit">Sign in</button>
              </form>
              <p class="mt-7 text-center text-sm text-text-muted">
                New to Floréa?
                <a
                  class="font-semibold text-evergreen underline decoration-evergreen/25 underline-offset-4"
                  href="/register"
                >
                  Create an account
                </a>
              </p>
            </div>
          </div>
        </div>
      </section>
      <aside class="relative hidden overflow-hidden bg-evergreen lg:block">
        <img
          class="absolute inset-0 size-full object-cover opacity-85"
          src="https://images.unsplash.com/photo-1487070183336-b863922373d4?auto=format&amp;fit=crop&amp;w=1500&amp;q=88"
          alt="Soft garden flowers arranged in natural light"
        />
        <div
          class="absolute inset-0 bg-gradient-to-t from-image-overlay/90 via-image-overlay/15 to-transparent"
        ></div>
        <blockquote class="absolute inset-x-0 bottom-0 p-12 text-white xl:p-16">
          <p class="max-w-lg font-display text-4xl leading-[1.08] tracking-[-0.04em]">
            “Where flowers are remembered, and small rituals are given room to grow.”
          </p>
          <footer
            class="mt-5 text-[0.66rem] font-bold uppercase tracking-[0.18em] text-blush"
          >
            The Floréa journal
          </footer>
        </blockquote>
      </aside>
    </main>
    <noscript>
      <p class="page-shell py-5">
        Enable JavaScript to load live product data and use account or checkout actions.
      </p>
    </noscript>
  </body>
</html>
