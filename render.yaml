services:
  - type: web
    name: florea-haven-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: florea-haven-db
          property: connectionString
      - key: TRUST_PROXY
        value: 'true'
      - key: AUTO_SEED
        value: 'true'
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: florea-haven-db
    plan: free
    region: singapore
    postgresMajorVersion: '16'
    databaseName: florea_haven
    user: florea
    ipAllowList: []
